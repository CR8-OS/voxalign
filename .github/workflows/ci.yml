name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Author name guard (never the hybrid form)
        run: |
          if grep -rEIni "CJ[[:space:]]+Jammet" --exclude-dir=.git .; then
            echo "Found forbidden hybrid name form"; exit 1; fi
      - name: Secrets guard (no tracked env/token files)
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|token' ; then
            echo "Tracked secret-like file"; exit 1; fi
