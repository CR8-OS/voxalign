[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxalign"
version = "0.1.0"
description = "Voice-attribution SRT reconciler: turn per-channel mics + an edited SRT into an accurate speaker-attributed transcript."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Christophe Jammet" }]
keywords = ["transcription", "srt", "speaker-diarization", "speaker-attribution",
            "podcast", "captions", "multitrack", "whisper"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/CR8-OS/voxalign"
Issues = "https://github.com/CR8-OS/voxalign/issues"

[project.scripts]
voxalign = "voxalign.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voxalign"]
